[package]
name = "prime_native"
version = "1.0.0"
edition = "2021"
authors = ["Prime Messenger Team <developer@primemessenger.com>"]
description = "Native high-performance core for Prime Desktop (C#/Rust Hybrid)"

[lib]
name = "prime_native"
crate-type = ["cdylib", "staticlib"]

[dependencies]
aes-gcm = "0.10"
sha2 = "0.10"
blake3 = "1.5"
byteorder = "1.5"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
