<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Messenger</title>
  <link rel="stylesheet" href="styles/prime.css">
</head>
<body class="theme-dark">

  <!-- Main 5-Column Grid Application Container -->
  <div id="app" class="prime-layout">

    <!-- Column 0: Sidebar (Supports 72px rail mode & 320px normal mode) -->
    <aside id="col-sidebar" class="sidebar normal-mode">
      
      <!-- Top Rail Avatar (Visible only in rail mode) -->
      <div id="rail-profile-avatar" class="rail-only" title="Мой профиль">
        <div class="avatar-circle user-avatar">
          <span id="rail-user-initials">Я</span>
        </div>
      </div>

      <!-- Top Header & Morphing Search Bar (Visible in normal mode) -->
      <div class="sidebar-header normal-only">
        <div id="profile-pill" class="profile-header-pill">
          <div class="avatar-circle user-avatar">
            <span id="sidebar-user-initials">Я</span>
          </div>
          <div class="user-meta">
            <span id="sidebar-user-name" class="user-name">Пользователь</span>
            <span class="user-status online">в сети</span>
          </div>
        </div>

        <div class="search-morph-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M9.5 3a6.5 6.5 0 0 1 5.25 10.33l4.96 4.96a1 1 0 0 1-1.42 1.42l-4.96-4.96A6.5 6.5 0 1 1 9.5 3m0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9"/>
          </svg>
          <input type="text" id="sidebar-search-input" class="seamless-input" placeholder="Поиск чатов или @username...">
        </div>
      </div>

      <!-- Chats List -->
      <div id="chats-list" class="chats-scroll-list">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Column 1: GridSplitter 1 (Sidebar resizing & Rail mode snap trigger) -->
    <div id="splitter-sidebar" class="grid-splitter" title="Перетяните для изменения размера или сворачивания в аватарки"></div>

    <!-- Column 2: Chat View -->
    <main id="col-chatview" class="chat-viewport">

      <!-- Active Chat Interface -->
      <div id="active-chat" class="active-chat-container">

        <!-- Top Floating Frosted Glass Island -->
        <header id="chat-header-island" class="glass-island top-island">
          <div class="chat-header-left">
            <div id="chat-header-avatar" class="avatar-circle">
              <span id="chat-header-initials">ПР</span>
            </div>
            <div class="chat-header-meta">
              <div id="chat-header-name" class="chat-header-title">Собеседник</div>
              <div id="chat-header-status" class="chat-header-subtitle">в сети</div>
            </div>
          </div>
          <div class="chat-header-actions">
            <button id="btn-call" class="icon-btn" title="Звонок">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z"/></svg>
            </button>
            <button id="btn-toggle-drawer" class="icon-btn" title="Информация о собеседнике">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </button>
          </div>
        </header>

        <!-- Smooth 0% to 50% Top Darkening Vignette -->
        <div class="chat-vignette vignette-top"></div>

        <!-- Messages Scroll Container (Spans full height, slides seamlessly under glass islands) -->
        <div id="messages-scroll" class="messages-scroll-area">
          <div class="messages-top-spacer"></div>
          <div id="messages-list" class="messages-container">
            <!-- Messages rendered dynamically -->
          </div>
          <div class="messages-bottom-spacer"></div>
        </div>

        <!-- Smooth 0% to 50% Bottom Darkening Vignette -->
        <div class="chat-vignette vignette-bottom"></div>

        <!-- Bottom Floating Frosted Glass Input Island -->
        <footer id="chat-input-island" class="glass-island bottom-island">
          <button id="btn-attach" class="icon-btn" title="Прикрепить файл или фото">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H9v9.5a3 3 0 0 0 6 0V5a4 4 0 0 0-8 0v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6z"/></svg>
          </button>
          <div class="input-text-wrapper">
            <textarea id="msg-input" class="seamless-textarea" rows="1" placeholder="Сообщение..."></textarea>
          </div>
          <button id="btn-emoji" class="icon-btn" title="Эмодзи">
            <span style="font-size: 16px;">😊</span>
          </button>
          <button id="btn-send" class="icon-btn btn-send" title="Отправить">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </footer>
      </div>

      <!-- Empty State Placeholder (when no chat selected) -->
      <div id="empty-chat-placeholder" class="empty-chat-view hidden">
        <div class="empty-icon-wrap">
          <svg viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <h2>Выберите чат, чтобы начать общение</h2>
      </div>
    </main>

    <!-- Column 3: GridSplitter 2 (Drawer resizing & snap-to-close trigger) -->
    <div id="splitter-drawer" class="grid-splitter" title="Перетяните к краю экрана для закрытия"></div>

    <!-- Column 4: Interlocutor Profile Drawer (Faithful to PersonInformationActivity.kt) -->
    <aside id="col-drawer" class="profile-drawer open">
      <div class="drawer-header">
        <button id="btn-close-drawer" class="icon-btn" title="Закрыть">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3>Информация</h3>
      </div>

      <div class="drawer-scroll-content">
        <!-- Big Hero Avatar & Details -->
        <div class="drawer-hero">
          <div id="drawer-avatar" class="avatar-hero">
            <span id="drawer-hero-initials">ПР</span>
          </div>
          <h2 id="drawer-hero-name" class="drawer-name">Собеседник</h2>
          <span id="drawer-hero-username" class="drawer-username">@peer</span>
          <div class="drawer-badge">🔐 Зашифровано AES-256</div>
        </div>

        <!-- Android Segmented Tabs (cardSharedContent) -->
        <div class="card-shared-tabs">
          <div class="pill-tabs-header">
            <button class="pill-tab active" data-tab="media">📷 Медиа <span id="count-media" class="tab-badge">0</span></button>
            <button class="pill-tab" data-tab="files">📁 Файлы <span id="count-files" class="tab-badge">0</span></button>
            <button class="pill-tab" data-tab="audio">🎵 Аудио <span id="count-audio" class="tab-badge">0</span></button>
          </div>

          <!-- Tab Content Panes -->
          <div id="tab-content-media" class="tab-pane active">
            <div id="media-grid" class="media-thumbnails-grid">
              <div class="empty-tab-hint">Нет общих фото или видео</div>
            </div>
          </div>

          <div id="tab-content-files" class="tab-pane">
            <div id="files-list" class="shared-files-list">
              <div class="empty-tab-hint">Нет файлов</div>
            </div>
          </div>

          <div id="tab-content-audio" class="tab-pane">
            <div id="audio-list" class="shared-audio-list">
              <div class="empty-tab-hint">Нет аудиозаписей</div>
            </div>
          </div>
        </div>
      </div>
    </aside>

  </div>

  <script src="scripts/app.js"></script>
</body>
</html>
